name: Publish signed Meeko preview

'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-meeko-v0.13.0-preview.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jhamende/meeko_android_releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          RELEASE_NOTES = "# Meeko — premier jet connecté\n\nVersion **0.13.0**, build **18**, Android ARM64/API24 minimum. Préversion de test avec données fictives uniquement.\n\nCette version se connecte au serveur HTTPS Meeko. Connexion privée, modification de profil, messages persistants avec réception en temps réel, proposition/confirmation indépendante de rendez-vous et copie des réglages ont été vérifiés contre le serveur actif. Aucun serveur de production ou véritable processus de vérification d'identité n'est ouvert.\n\n## Nouvelle expérience\n\nRefonte des parcours membres : découverte organisée, invitations, profil, messages, rendez-vous et outils de sécurité/données. Deux nouvelles photos d’ambiance originales et la police Manrope sont intégrées à l’APK, sans téléchargement à l’ouverture. Les images décoratives ne représentent ni un membre ni une présence réelle. Les réglages de l’application sont regroupés dans Mon espace. Le chat propose explicitement de préparer un rendez-vous, sans création automatique. Les limites du test sont accessibles depuis « À propos de cette version » ; le bandeau de données fictives reste permanent.\n\n## Installer\n\nTélécharger puis ouvrir `meeko-0.13.0-preview.1-arm64.apk`. Le même identifiant d'application et la même clé de signature sont utilisés que dans la démo précédente. Les identifiants des comptes fictifs sont fournis séparément par le propriétaire : aucun mot de passe n'est inclus ici.\n\nAvec les deux premiers comptes de test, ouvrir Messages pour retrouver une conversation fictive préchargée, envoyer un texte puis se connecter avec l'autre compte pour le lire. Le scénario initial est une donnée de test ; les nouvelles invitations nécessitent toujours deux décisions indépendantes. Les deux autres comptes permettent de tester la découverte après consentement et échantillons simulés explicites. Aucun GPS réel.\n\n## Périmètre\n\nLes inscriptions publiques, photos, audio, récupération et comptes de modération sont fermés sur cette préversion. Les signalements servent uniquement à tester les écrans et le stockage ; aucune équipe réelle ne les traite. Ne pas utiliser de données personnelles réelles. Certaines copies de données restent partielles.\n\nValidation : 650 tests Flutter, 476 tests backend avant le dernier durcissement du lanceur puis 42 cas ciblés, contrat Dart public HTTPS/WSS et tests de confidentialité. APK release signé, non débogable, HTTP en clair et sauvegardes désactivés, alignement natif vérifié. Les tests sur appareil Android réel, performance et permissions restent à réaliser. Le serveur de test n'a pas de redémarrage automatique après panne ou redémarrage de l'hôte.\n\nVérifier l'intégrité de l'APK avec le fichier SHA256SUMS fourni.\n\nSHA-256 de l’APK :\n\n```text\n4a4735f4ef7730c8a9a374ffae8d38a92fece22047ff65908fa155aebb46aaa2\n```\n"
          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "Jhamende/meeko_android_releases"
          TAG = "v0.13.0-preview.1"
          BUNDLE = "https://meeko.jh-it.be/releases/meeko-0.13.0-preview.1-arm64.zip"
          BUNDLE_SHA = "65746323015cc1b03b200ec805f36522ee01068cf5eb715483c3837d8a2406bf"
          BUNDLE_BYTES = 27351321
          APK = "meeko-0.13.0-preview.1-arm64.apk"
          EXPECTED = {
              APK: (27343476, "4a4735f4ef7730c8a9a374ffae8d38a92fece22047ff65908fa155aebb46aaa2"),
              "FONT_LICENSE.txt": (4387, "58172e0c0fac2cda8a37b348164bb55e44b0e69051e557e92b1d3f6910141f7b"),
          }
          API = "https://api.github.com/repos/" + REPO

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def public_download(url, maximum):
              require(urllib.parse.urlsplit(url).scheme == "https", "HTTPS required")
              with urllib.request.urlopen(url, timeout=120) as response:
                  require(urllib.parse.urlsplit(response.url).scheme == "https", "HTTPS redirect required")
                  data = response.read(maximum + 1)
              require(len(data) <= maximum, "Download size exceeded")
              return data

          bundle = public_download(BUNDLE, BUNDLE_BYTES)
          require(len(bundle) == BUNDLE_BYTES, "Bundle size mismatch")
          require(hashlib.sha256(bundle).hexdigest() == BUNDLE_SHA, "Bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              names = archive.namelist()
              require(len(names) == 4 and set(names) == {APK, "SHA256SUMS", "FONT_LICENSE.txt", "RELEASE_NOTES.md"}, "Unexpected bundle contents")
              for name, (size, digest) in EXPECTED.items():
                  require(archive.getinfo(name).file_size == size, "Unexpected member size")
              assets = {name: archive.read(name) for name in (APK, "SHA256SUMS", "FONT_LICENSE.txt")}
          for name, (size, digest) in EXPECTED.items():
              require(len(assets[name]) == size and hashlib.sha256(assets[name]).hexdigest() == digest, "Asset integrity mismatch: " + name)
          sums = "".join(digest + "  " + name + "\n" for name, (size, digest) in EXPECTED.items()).encode()
          require(assets["SHA256SUMS"] == sums, "Checksum manifest mismatch")
          print("Verified signed APK bytes, font license and checksum manifest.")
          if "--verify-only" in sys.argv:
              sys.exit(0)

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Wrong release repository")
          token = os.environ["GH_TOKEN"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def api_request(method, url, payload=None, content_type="application/json", missing=False):
              host = urllib.parse.urlsplit(url)
              require(host.scheme == "https" and host.netloc in {"api.github.com", "uploads.github.com"}, "Untrusted authenticated endpoint")
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": content_type, "User-Agent": "Meeko-signed-preview-publisher"}
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub " + method + " failed with HTTP " + str(error.code)) from None

          release = api_request("GET", API + "/releases/tags/" + TAG, missing=True)
          if release is None:
              release = api_request("POST", API + "/releases", {
                  "tag_name": TAG, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": "Meeko 0.13.0-preview.1 — Android ARM64", "body": RELEASE_NOTES,
                  "draft": True, "prerelease": True, "make_latest": "false",
              })
          require(release["tag_name"] == TAG and release["prerelease"], "Unexpected release")
          existing = api_request("GET", API + "/releases/" + str(release["id"]) + "/assets?per_page=100")
          by_name = {item["name"]: item for item in existing}
          require(len(by_name) == len(existing) and set(by_name) <= set(assets), "Unexpected existing release assets")
          upload = release["upload_url"].split("{", 1)[0]
          require(upload == "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets", "Unexpected upload URL")
          for name, data in assets.items():
              item = by_name.get(name)
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if item is None:
                  require(release["draft"], "Published release is incomplete; refusing mutation")
                  item = api_request("POST", upload + "?" + urllib.parse.urlencode({"name": name}), data, "application/vnd.android.package-archive" if name.endswith(".apk") else "text/plain; charset=utf-8")
              require(item["name"] == name and item["size"] == len(data) and item["state"] == "uploaded", "Uploaded asset metadata mismatch")
              require(item.get("digest") == digest, "GitHub asset digest mismatch")
          if release["draft"]:
              release = api_request("PATCH", API + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True, "body": RELEASE_NOTES, "make_latest": "false"})
          require(not release["draft"] and release["prerelease"], "Release was not published as a prerelease")
          require(release["body"] == RELEASE_NOTES, "Published notes mismatch")
          for name, data in assets.items():
              url = "https://github.com/" + REPO + "/releases/download/" + TAG + "/" + name
              downloaded = public_download(url, len(data))
              require(hashlib.sha256(downloaded).digest() == hashlib.sha256(data).digest(), "Published download integrity mismatch")
              print("Verified public download: " + name)
          print("Published " + release["html_url"])
          PY
