name: Publish signed Meeko preview

'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-meeko-v0.14.0-preview.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jhamende/meeko_android_releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          RELEASE_NOTES = '# Meeko — préversion sombre et corail\n\nVersion **0.14.0**, build **19**. Android ARM64, Android 7.0/API24 minimum. APK signée avec la même clé que 0.13.0. Version de test avec comptes fictifs privés uniquement.\n\n## Interface\n\nConnexion classique : photo de fond animée par panoramique/zoom, identifiant et mot de passe, puis liens « Mot de passe oublié » et « Créer un compte ». L’animation s’arrête en arrière-plan et quand les animations sont réduites. Les liens expliquent les limites de la préversion ; ils n’ouvrent aucune inscription ou récupération sur le serveur de test.\n\nAccueil sombre et corail, radar abstrait sans personne ni localisation, navigation simplifiée et icônes cohérentes. Disponible maintenant ouvre les réglages avec consentement explicite ; une intention choisie prépare un brouillon du profil à enregistrer. Proposition compatible, profil complet autorisé, décisions indépendantes, conversation puis rendez-vous. Aucun cœur, like, swipe ou écran « C’est un match ! ». Les photos décoratives ne représentent pas un membre ; le profil utilise les photos privées autorisées ou une initiale honnête.\n\nChat en temps réel et rendez-vous sur le même backend HTTPS. Café/balade/repas changent uniquement l’aide à la saisie ; chacun choisit le lieu public et confirme lui-même. La saisie d’un profil et les brouillons de disponibilité conservent les protections de session et les confirmations de sortie.\n\n## Installer et essayer\n\nTélécharger puis ouvrir `meeko-0.14.0-preview.1-arm64.apk`, puis utiliser les identifiants fictifs remis séparément par le propriétaire. Aucun mot de passe ni clé de signature n’est fourni. Les deux premiers comptes permettent de tester une conversation fictive préchargée ; les autres gardent leurs étapes explicites de découverte réciproque. Vérifier SHA256SUMS avant installation.\n\n## Périmètre\n\nInscriptions publiques, photos/audio, GPS réel, récupération et comptes de modération fermés sur ce test. Les signalements servent au test et ne sont pas traités par une équipe réelle. Ne pas utiliser de données personnelles réelles. Aucun test sur téléphone physique ni mesure de performance n’est revendiqué. Le serveur de test n’a pas de redémarrage automatique après panne ou redémarrage de l’hôte.\n\nSource de l’APK : `61fc3ce`. Intégrité APK SHA256 : `c917947f333919227db629a6debc60a695b3a3850844f19577d4fbd04c2c04cc`.\n'
          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "Jhamende/meeko_android_releases"
          TAG = "v0.14.0-preview.1"
          BUNDLE = "https://meeko.jh-it.be/releases/meeko-0.14.0-preview.1-arm64.zip"
          BUNDLE_SHA = "c7ea19bed6d3cf4bf8e57877fb18fd8623e4e990955117d24f7fcbfbc0b59e5c"
          BUNDLE_BYTES = 16499450
          APK = "meeko-0.14.0-preview.1-arm64.apk"
          EXPECTED = {
              APK: (27343476, "c917947f333919227db629a6debc60a695b3a3850844f19577d4fbd04c2c04cc"),
              "FONT_LICENSE.txt": (4387, "58172e0c0fac2cda8a37b348164bb55e44b0e69051e557e92b1d3f6910141f7b"),
          }
          API = "https://api.github.com/repos/" + REPO

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def public_download(url, maximum):
              require(urllib.parse.urlsplit(url).scheme == "https", "HTTPS required")
              with urllib.request.urlopen(url, timeout=120) as response:
                  require(urllib.parse.urlsplit(response.url).scheme == "https", "HTTPS redirect required")
                  data = response.read(maximum + 1)
              require(len(data) <= maximum, "Download size exceeded")
              return data

          bundle = public_download(BUNDLE, BUNDLE_BYTES)
          require(len(bundle) == BUNDLE_BYTES, "Bundle size mismatch")
          require(hashlib.sha256(bundle).hexdigest() == BUNDLE_SHA, "Bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              names = archive.namelist()
              require(len(names) == 4 and set(names) == {APK, "SHA256SUMS", "FONT_LICENSE.txt", "RELEASE_NOTES.md"}, "Unexpected bundle contents")
              for name, (size, digest) in EXPECTED.items():
                  require(archive.getinfo(name).file_size == size, "Unexpected member size")
              assets = {name: archive.read(name) for name in (APK, "SHA256SUMS", "FONT_LICENSE.txt")}
          for name, (size, digest) in EXPECTED.items():
              require(len(assets[name]) == size and hashlib.sha256(assets[name]).hexdigest() == digest, "Asset integrity mismatch: " + name)
          sums = "".join(digest + "  " + name + "\n" for name, (size, digest) in EXPECTED.items()).encode()
          require(assets["SHA256SUMS"] == sums, "Checksum manifest mismatch")
          print("Verified signed APK bytes, font license and checksum manifest.")
          if "--verify-only" in sys.argv:
              sys.exit(0)

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Wrong release repository")
          token = os.environ["GH_TOKEN"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def api_request(method, url, payload=None, content_type="application/json", missing=False):
              host = urllib.parse.urlsplit(url)
              require(host.scheme == "https" and host.netloc in {"api.github.com", "uploads.github.com"}, "Untrusted authenticated endpoint")
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": content_type, "User-Agent": "Meeko-signed-preview-publisher"}
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub " + method + " failed with HTTP " + str(error.code)) from None

          release = api_request("GET", API + "/releases/tags/" + TAG, missing=True)
          if release is None:
              release = api_request("POST", API + "/releases", {
                  "tag_name": TAG, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": "Meeko 0.14.0-preview.1 — Android ARM64", "body": RELEASE_NOTES,
                  "draft": True, "prerelease": True, "make_latest": "false",
              })
          require(release["tag_name"] == TAG and release["prerelease"], "Unexpected release")
          existing = api_request("GET", API + "/releases/" + str(release["id"]) + "/assets?per_page=100")
          by_name = {item["name"]: item for item in existing}
          require(len(by_name) == len(existing) and set(by_name) <= set(assets), "Unexpected existing release assets")
          upload = release["upload_url"].split("{", 1)[0]
          require(upload == "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets", "Unexpected upload URL")
          for name, data in assets.items():
              item = by_name.get(name)
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if item is None:
                  require(release["draft"], "Published release is incomplete; refusing mutation")
                  item = api_request("POST", upload + "?" + urllib.parse.urlencode({"name": name}), data, "application/vnd.android.package-archive" if name.endswith(".apk") else "text/plain; charset=utf-8")
              require(item["name"] == name and item["size"] == len(data) and item["state"] == "uploaded", "Uploaded asset metadata mismatch")
              require(item.get("digest") == digest, "GitHub asset digest mismatch")
          if release["draft"]:
              release = api_request("PATCH", API + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True, "body": RELEASE_NOTES, "make_latest": "false"})
          require(not release["draft"] and release["prerelease"], "Release was not published as a prerelease")
          require(release["body"] == RELEASE_NOTES, "Published notes mismatch")
          for name, data in assets.items():
              url = "https://github.com/" + REPO + "/releases/download/" + TAG + "/" + name
              downloaded = public_download(url, len(data))
              require(hashlib.sha256(downloaded).digest() == hashlib.sha256(data).digest(), "Published download integrity mismatch")
              print("Verified public download: " + name)
          print("Published " + release["html_url"])
          PY
