name: Publish signed Meeko connected account pilot

'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pilot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-meeko-v0.21.0-pilot.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jhamende/meeko_android_releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the previously signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          RELEASE_NOTES = "# Meeko0.21.0 — Tes recherches, près de toi\n\nVersion Android connectée0.21.0+27, ARM64, Android7.0 minimum. Même signature pour mettre à jour le pilote existant.\n\n- Préférences privées dans le profil et le wizard : personnes recherchées séparément pour amour, amitié et activités. Plusieurs choix possibles, ou tout le monde.\n- Genre déclaré facultatif et privé. Aucun genre ou choix amoureux déduit pour les anciens comptes ; le choix amoureux doit être confirmé explicitement.\n- Rayon approximatif de5,10,20,30 ou50km. Les secteurs voisins peuvent produire une proposition ; le plus petit rayon des deux personnes s'applique. La localisation par zone conserve une marge d'incertitude, sans distance ni position individuelle affichée.\n- Les critères doivent fonctionner dans les deux sens, avec les intentions, âges, objectifs amoureux, accords et protections existants.\n- Les modifications annulent les invitations en attente et demandent d'actualiser la zone. Les conversations déjà acceptées restent accessibles.\n- Export des nouveaux choix sur demande explicite avec confirmation et mot de passe ; effacement lors de la suppression du compte. Contrôles accessibles FR/NL/EN, y compris grands caractères.\n- Correction d'un blocage concurrent du chat pendant l'activité du worker de recherche, sans modifier les autorisations ou la révocation.\n\nAprès installation : Mon profil → Mes préférences de recherche. Enregistre tes choix puis actualise ta zone dans Ma disponibilité. Les nouveaux comptes suivent le wizard. Les anciens clients n'effacent pas les nouveaux choix qu'ils omettent.\n\nInscription, connexion, récupération par clé, profil et suppression utilisent le backend réel. Aucun faux membre. Email toujours reporté à la demande du propriétaire. La localisation privée peut être préparée avant le contrôle de majorité ; l'arrière-plan exige une activation distincte et peut être interrompu par Android.\n\nLe contrôle humain18+, la revue photo et le recours indépendant restent à mettre en service. Aucun badge ou accès aux rencontres n'est accordé artificiellement. Les tests automatisés utilisent des comptes et cellules inventés ; réception FCM, batterie et expérience sur téléphone restent à vérifier. Cette release ne déclare pas tout le cahier des charges accepté.\n\nSources figées : `76ec370`. APK signé, signature existante, manifeste privé/HTTPS, bibliothèques16K, assets et absence de clés serveur vérifiés avant publication. Migration additive0029 avec conservation des colonnes et données précédentes.\n\nSHA256 APK : `39566dd7d417a53f8d03c96bbbec43345f6ec8b20d5a059f58a5b211b27efdf4`. Télécharger l'APK joint ; les archives « Source code » de GitHub ne sont pas l'application.\n"
          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "Jhamende/meeko_android_releases"
          TAG = "v0.21.0-pilot.1"
          BUNDLE = "https://meeko.jh-it.be/releases/meeko-0.21.0-pilot.1-arm64.zip"
          BUNDLE_SHA = "583c1d6338f3373129738ee29a49ba8bc665db732f1344d3f9858eec4ab77a66"
          BUNDLE_BYTES = 16637238
          APK = "meeko-0.21.0-pilot.1-arm64.apk"
          EXPECTED = {
              APK: (28803757, "39566dd7d417a53f8d03c96bbbec43345f6ec8b20d5a059f58a5b211b27efdf4"),
              "FONT_LICENSE.txt": (4387, "58172e0c0fac2cda8a37b348164bb55e44b0e69051e557e92b1d3f6910141f7b"),
          }
          API = "https://api.github.com/repos/" + REPO

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def public_download(url, maximum):
              require(urllib.parse.urlsplit(url).scheme == "https", "HTTPS required")
              with urllib.request.urlopen(url, timeout=120) as response:
                  require(urllib.parse.urlsplit(response.url).scheme == "https", "HTTPS redirect required")
                  data = response.read(maximum + 1)
              require(len(data) <= maximum, "Download size exceeded")
              return data

          bundle = public_download(BUNDLE, BUNDLE_BYTES)
          require(len(bundle) == BUNDLE_BYTES, "Bundle size mismatch")
          require(hashlib.sha256(bundle).hexdigest() == BUNDLE_SHA, "Bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              names = archive.namelist()
              require(len(names) == 4 and set(names) == {APK, "SHA256SUMS", "FONT_LICENSE.txt", "RELEASE_NOTES.md"}, "Unexpected bundle contents")
              for name, (size, digest) in EXPECTED.items():
                  require(archive.getinfo(name).file_size == size, "Unexpected member size")
              assets = {name: archive.read(name) for name in (APK, "SHA256SUMS", "FONT_LICENSE.txt")}
          for name, (size, digest) in EXPECTED.items():
              require(len(assets[name]) == size and hashlib.sha256(assets[name]).hexdigest() == digest, "Asset integrity mismatch: " + name)
          sums = "".join(digest + "  " + name + "\n" for name, (size, digest) in EXPECTED.items()).encode()
          require(assets["SHA256SUMS"] == sums, "Checksum manifest mismatch")
          print("Verified signed APK bytes, font license and checksum manifest.")
          if "--verify-only" in sys.argv:
              sys.exit(0)

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Wrong release repository")
          token = os.environ["GH_TOKEN"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def api_request(method, url, payload=None, content_type="application/json", missing=False):
              host = urllib.parse.urlsplit(url)
              require(host.scheme == "https" and host.netloc in {"api.github.com", "uploads.github.com"}, "Untrusted authenticated endpoint")
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": content_type, "User-Agent": "Meeko-signed-preview-publisher"}
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub " + method + " failed with HTTP " + str(error.code)) from None

          release = api_request("GET", API + "/releases/tags/" + TAG, missing=True)
          if release is None:
              release = api_request("POST", API + "/releases", {
                  "tag_name": TAG, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": "Meeko 0.21.0-pilot.1 — Android ARM64", "body": RELEASE_NOTES,
                  "draft": True, "prerelease": True, "make_latest": "false",
              })
          require(release["tag_name"] == TAG and release["prerelease"], "Unexpected release")
          existing = api_request("GET", API + "/releases/" + str(release["id"]) + "/assets?per_page=100")
          by_name = {item["name"]: item for item in existing}
          require(len(by_name) == len(existing) and set(by_name) <= set(assets), "Unexpected existing release assets")
          upload = release["upload_url"].split("{", 1)[0]
          require(upload == "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets", "Unexpected upload URL")
          for name, data in assets.items():
              item = by_name.get(name)
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if item is None:
                  require(release["draft"], "Published release is incomplete; refusing mutation")
                  item = api_request("POST", upload + "?" + urllib.parse.urlencode({"name": name}), data, "application/vnd.android.package-archive" if name.endswith(".apk") else "text/plain; charset=utf-8")
              require(item["name"] == name and item["size"] == len(data) and item["state"] == "uploaded", "Uploaded asset metadata mismatch")
              require(item.get("digest") == digest, "GitHub asset digest mismatch")
          if release["draft"]:
              release = api_request("PATCH", API + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True, "body": RELEASE_NOTES, "make_latest": "false"})
          require(not release["draft"] and release["prerelease"], "Release was not published as a prerelease")
          require(release["body"] == RELEASE_NOTES, "Published notes mismatch")
          for name, data in assets.items():
              url = "https://github.com/" + REPO + "/releases/download/" + TAG + "/" + name
              downloaded = public_download(url, len(data))
              require(hashlib.sha256(downloaded).digest() == hashlib.sha256(data).digest(), "Published download integrity mismatch")
              print("Verified public download: " + name)
          print("Published " + release["html_url"])

          PY
