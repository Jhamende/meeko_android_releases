name: Publish signed Meeko connected account pilot

'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pilot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-meeko-v0.19.0-pilot.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jhamende/meeko_android_releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the previously signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          RELEASE_NOTES = '# Meeko — localisation privée et arrière-plan\n\nVersion **0.19.0**, build **24**, Android ARM64/API24 minimum. Même signature :\ninstallez cette APK sur la précédente, sans désinstaller ni recréer votre compte.\n\n## Activer\n\nReconnectez-vous pour bénéficier d’une nouvelle session pouvant durer8 heures.\nComplétez le profil, puis ouvrez vos réglages de disponibilité depuis l’accueil.\nAutorisez la localisation approximative Android, activez votre disponibilité et\n**enregistrez** ces choix. L’actualisation manuelle de la zone permet un premier essai.\n\nOuvrez **Découverte en arrière-plan**. Autorisez l’indicateur Android, cochez le choix\nd’activation et appuyez sur **Activer sur cet appareil**. Une notification Meeko reste\nvisible avec l’action **Mettre en pause**. Le service peut continuer quand l’application\nn’est plus affichée ou que l’écran est éteint. La durée réelle reste limitée par la\nsession, à8 heures maximum ; l’heure de fin est affichée. Android, les réglages de\nbatterie ou l’arrêt forcé peuvent interrompre le service. Aucune relance cachée ou\nautomatique au redémarrage n’est mise en place.\n\n« Service actif · position en attente » se distingue d’une zone réellement reçue par\nle serveur. Une coupure réseau ne produit pas de faux succès. Le fournisseur fusionné\nAndroid est utilisé lorsqu’il est disponible, avec repli réseau ; aucun accès précis\nou « toujours autoriser » n’est demandé. Seule une zone approximative quitte le\ncode natif, jamais un trajet GPS, une position d’un autre membre ou une distance.\n\nUn adulte avec profil complet peut activer sa localisation privée avant le contrôle\nhumain de majorité. Il reste exclu des propositions et des contacts tant qu’il n’est\npas contrôlé. Les comptes restreints/refusés/en cours de contrôle restent bloqués\npour la collecte. Déclarer une date de naissance ne vérifie pas la majorité.\nUn diagnostic local est également proposé quand l’envoi ne peut pas être activé.\n\n## Vérifications et limites\n\n684 tests backend complets plus2 cas de session,784 tests Flutter complets,15 cas UI\nfinaux, analyse statique,57 contrôles JVM et contrats Dart/HTTP réels passent.\nLe parcours public teste aussi l’envoi privé sur compte non contrôlé, l’absence de\npropositions, la pause, la révocation, la récupération et la suppression du compte.\nLes positions de test sont artificielles ; aucun comportement sur téléphone physique,\nmesure de batterie ou fonctionnement continu n’est revendiqué.\n\nLe backend réel conserve les comptes existants. Les rencontres attendent toujours\nla mise en service des opérateurs humains avec MFA, du recours indépendant et du\nstockage privé des justificatifs. Ce pilote ne déclare pas tout le cahier des charges\nlivré en production. Email et vérification email restent reportés ; configurez votre\nclé personnelle de récupération dans Mon espace.\n\nAPK signée avec la clé existante, API HTTPS, manifest, assets, alignement16K et absence\ndes secrets serveur contrôlés. Source `cace239`. SHA256 APK : `7eb6125a0bb121986e5fd10bf02952933db7f1bb7939a4f6d49e6e7b840770d0`.\nSHA256SUMS et FONT_LICENSE.txt accompagnent l’APK. Le dépôt est public ; le code de\nl’application, les clés et les configurations privées ne sont pas publiés.\n'
          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "Jhamende/meeko_android_releases"
          TAG = "v0.19.0-pilot.1"
          BUNDLE = "https://meeko.jh-it.be/releases/meeko-0.19.0-pilot.1-arm64.zip"
          BUNDLE_SHA = "4e3960b572feb481e2a652e5e705c3a117924197df7f96b84d48158010484fb6"
          BUNDLE_BYTES = 16374414
          APK = "meeko-0.19.0-pilot.1-arm64.apk"
          EXPECTED = {
              APK: (28144181, "7eb6125a0bb121986e5fd10bf02952933db7f1bb7939a4f6d49e6e7b840770d0"),
              "FONT_LICENSE.txt": (4387, "58172e0c0fac2cda8a37b348164bb55e44b0e69051e557e92b1d3f6910141f7b"),
          }
          API = "https://api.github.com/repos/" + REPO

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def public_download(url, maximum):
              require(urllib.parse.urlsplit(url).scheme == "https", "HTTPS required")
              with urllib.request.urlopen(url, timeout=120) as response:
                  require(urllib.parse.urlsplit(response.url).scheme == "https", "HTTPS redirect required")
                  data = response.read(maximum + 1)
              require(len(data) <= maximum, "Download size exceeded")
              return data

          bundle = public_download(BUNDLE, BUNDLE_BYTES)
          require(len(bundle) == BUNDLE_BYTES, "Bundle size mismatch")
          require(hashlib.sha256(bundle).hexdigest() == BUNDLE_SHA, "Bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              names = archive.namelist()
              require(len(names) == 4 and set(names) == {APK, "SHA256SUMS", "FONT_LICENSE.txt", "RELEASE_NOTES.md"}, "Unexpected bundle contents")
              for name, (size, digest) in EXPECTED.items():
                  require(archive.getinfo(name).file_size == size, "Unexpected member size")
              assets = {name: archive.read(name) for name in (APK, "SHA256SUMS", "FONT_LICENSE.txt")}
          for name, (size, digest) in EXPECTED.items():
              require(len(assets[name]) == size and hashlib.sha256(assets[name]).hexdigest() == digest, "Asset integrity mismatch: " + name)
          sums = "".join(digest + "  " + name + "\n" for name, (size, digest) in EXPECTED.items()).encode()
          require(assets["SHA256SUMS"] == sums, "Checksum manifest mismatch")
          print("Verified signed APK bytes, font license and checksum manifest.")
          if "--verify-only" in sys.argv:
              sys.exit(0)

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Wrong release repository")
          token = os.environ["GH_TOKEN"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def api_request(method, url, payload=None, content_type="application/json", missing=False):
              host = urllib.parse.urlsplit(url)
              require(host.scheme == "https" and host.netloc in {"api.github.com", "uploads.github.com"}, "Untrusted authenticated endpoint")
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": content_type, "User-Agent": "Meeko-signed-preview-publisher"}
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub " + method + " failed with HTTP " + str(error.code)) from None

          release = api_request("GET", API + "/releases/tags/" + TAG, missing=True)
          if release is None:
              release = api_request("POST", API + "/releases", {
                  "tag_name": TAG, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": "Meeko 0.19.0-pilot.1 — Android ARM64", "body": RELEASE_NOTES,
                  "draft": True, "prerelease": True, "make_latest": "false",
              })
          require(release["tag_name"] == TAG and release["prerelease"], "Unexpected release")
          existing = api_request("GET", API + "/releases/" + str(release["id"]) + "/assets?per_page=100")
          by_name = {item["name"]: item for item in existing}
          require(len(by_name) == len(existing) and set(by_name) <= set(assets), "Unexpected existing release assets")
          upload = release["upload_url"].split("{", 1)[0]
          require(upload == "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets", "Unexpected upload URL")
          for name, data in assets.items():
              item = by_name.get(name)
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if item is None:
                  require(release["draft"], "Published release is incomplete; refusing mutation")
                  item = api_request("POST", upload + "?" + urllib.parse.urlencode({"name": name}), data, "application/vnd.android.package-archive" if name.endswith(".apk") else "text/plain; charset=utf-8")
              require(item["name"] == name and item["size"] == len(data) and item["state"] == "uploaded", "Uploaded asset metadata mismatch")
              require(item.get("digest") == digest, "GitHub asset digest mismatch")
          if release["draft"]:
              release = api_request("PATCH", API + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True, "body": RELEASE_NOTES, "make_latest": "false"})
          require(not release["draft"] and release["prerelease"], "Release was not published as a prerelease")
          require(release["body"] == RELEASE_NOTES, "Published notes mismatch")
          for name, data in assets.items():
              url = "https://github.com/" + REPO + "/releases/download/" + TAG + "/" + name
              downloaded = public_download(url, len(data))
              require(hashlib.sha256(downloaded).digest() == hashlib.sha256(data).digest(), "Published download integrity mismatch")
              print("Verified public download: " + name)
          print("Published " + release["html_url"])

          PY
