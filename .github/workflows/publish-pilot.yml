name: Publish signed Meeko connected account pilot

'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pilot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-meeko-v0.22.0-pilot.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jhamende/meeko_android_releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the previously signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          RELEASE_NOTES = "# Meeko — une interface pensée pour la rencontre\n\nVersion **0.22.0**, build **28**. Android ARM64, Android7.0/API24 minimum.\nMême package et même signature pour mettre à jour l'application existante.\n\n## Ce qui change\n\n- Base claire et corail, grandes photos autorisées, navigation **Découvrir / Invitations /\n  Messages / Profil**, accès direct aux préférences et radar facultatif replié.\n- Inscription progressive : prénom, photos, envies, objectifs amoureux si concernés,\n  genre facultatif, personnes recherchées, intérêts, rayon et récapitulatif. Une\n  question à la fois, retour possible et action fixe. Le profil est enregistré à la\n  confirmation finale ; les photos téléversées sont des opérations séparées.\n- Profil personnel avec photo, statut de validation, édition, photos et préférences\n  accessibles directement. Thème sombre toujours disponible ; connexion photographique animée.\n- Invitations limitées aux personnes autorisées, profil complet avant décision et\n  consentement mutuel avant le chat. Aucun like, swipe ou catalogue de personnes.\n\n## Installer et essayer\n\nTélécharger `meeko-0.22.0-pilot.1-arm64.apk`, puis créer son compte ou se connecter.\nConserver son compte existant. Le backend HTTPS réel gère inscription, profil,\npréférences privées réciproques, récupération par clé personnelle et suppression.\nL'email et sa vérification restent reportés à la demande du propriétaire.\n\nLa localisation approximative et son service Android visible sont sur accord\nexplicite. Android peut interrompre l'arrière-plan ; aucune continuité n'est promise.\nAucune position ou distance individuelle d'un autre membre n'est affichée.\n\n## Photos et limites du pilote\n\nL'administration photo utilise l'application privée **Meeko Équipe**, un opérateur\nindividuel et une authentification à deux facteurs. Elle n'est pas publiée dans ce\ndépôt. Le propriétaire doit configurer ses facteurs dans son terminal privé.\nUne photo n'entre dans la file qu'après contrôle18+ et demande de partage du membre.\nL'approbation photo ne remplace aucun de ces prérequis.\n\nLa collecte des justificatifs et le contrôle humain de majorité ne sont pas encore\nouverts : leurs opérateurs, le recours indépendant et les opérations de preuves\nprivées restent à mettre en service. Les rencontres restent soumises à ces contrôles.\nAucun membre fictif ni statut vérifié forcé n'est ajouté au service réel.\n\nLes tests de source et captures synthétiques ne remplacent pas la recette sur\ntéléphone. Réception FCM, comportement Android, accessibilité et performances sur\nappareil réel restent à vérifier. Cette release ne déclare pas tout le cahier des\ncharges livré. Le serveur du pilote n'a pas de relance automatique après panne.\n\nSource : `321800c`. SHA256 APK : `68414cdeb3fad3f167882fa7b264b0c70e7227d8d0005ed7cadd8598f534120d`.\nLes fichiers joints contiennent l'APK signé, les empreintes et la licence des fontes.\nAucune source, clé de signature, configuration privée ou accès administrateur.\n"
          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "Jhamende/meeko_android_releases"
          TAG = "v0.22.0-pilot.1"
          BUNDLE = "https://meeko.jh-it.be/releases/meeko-0.22.0-pilot.1-arm64.zip"
          BUNDLE_SHA = "5a15e420b6f30da305455203fd9556a26faaf894d0d4c6de0d34038a1150fc80"
          BUNDLE_BYTES = 16679211
          APK = "meeko-0.22.0-pilot.1-arm64.apk"
          EXPECTED = {
              APK: (28873389, "68414cdeb3fad3f167882fa7b264b0c70e7227d8d0005ed7cadd8598f534120d"),
              "FONT_LICENSE.txt": (4387, "58172e0c0fac2cda8a37b348164bb55e44b0e69051e557e92b1d3f6910141f7b"),
          }
          API = "https://api.github.com/repos/" + REPO

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def public_download(url, maximum):
              require(urllib.parse.urlsplit(url).scheme == "https", "HTTPS required")
              with urllib.request.urlopen(url, timeout=120) as response:
                  require(urllib.parse.urlsplit(response.url).scheme == "https", "HTTPS redirect required")
                  data = response.read(maximum + 1)
              require(len(data) <= maximum, "Download size exceeded")
              return data

          bundle = public_download(BUNDLE, BUNDLE_BYTES)
          require(len(bundle) == BUNDLE_BYTES, "Bundle size mismatch")
          require(hashlib.sha256(bundle).hexdigest() == BUNDLE_SHA, "Bundle hash mismatch")
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              names = archive.namelist()
              require(len(names) == 4 and set(names) == {APK, "SHA256SUMS", "FONT_LICENSE.txt", "RELEASE_NOTES.md"}, "Unexpected bundle contents")
              for name, (size, digest) in EXPECTED.items():
                  require(archive.getinfo(name).file_size == size, "Unexpected member size")
              assets = {name: archive.read(name) for name in (APK, "SHA256SUMS", "FONT_LICENSE.txt")}
          for name, (size, digest) in EXPECTED.items():
              require(len(assets[name]) == size and hashlib.sha256(assets[name]).hexdigest() == digest, "Asset integrity mismatch: " + name)
          sums = "".join(digest + "  " + name + "\n" for name, (size, digest) in EXPECTED.items()).encode()
          require(assets["SHA256SUMS"] == sums, "Checksum manifest mismatch")
          print("Verified signed APK bytes, font license and checksum manifest.")
          if "--verify-only" in sys.argv:
              sys.exit(0)

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Wrong release repository")
          token = os.environ["GH_TOKEN"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def api_request(method, url, payload=None, content_type="application/json", missing=False):
              host = urllib.parse.urlsplit(url)
              require(host.scheme == "https" and host.netloc in {"api.github.com", "uploads.github.com"}, "Untrusted authenticated endpoint")
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": content_type, "User-Agent": "Meeko-signed-preview-publisher"}
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError("GitHub " + method + " failed with HTTP " + str(error.code)) from None

          release = api_request("GET", API + "/releases/tags/" + TAG, missing=True)
          if release is None:
              release = api_request("POST", API + "/releases", {
                  "tag_name": TAG, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": "Meeko 0.22.0-pilot.1 — Android ARM64", "body": RELEASE_NOTES,
                  "draft": True, "prerelease": True, "make_latest": "false",
              })
          require(release["tag_name"] == TAG and release["prerelease"], "Unexpected release")
          existing = api_request("GET", API + "/releases/" + str(release["id"]) + "/assets?per_page=100")
          by_name = {item["name"]: item for item in existing}
          require(len(by_name) == len(existing) and set(by_name) <= set(assets), "Unexpected existing release assets")
          upload = release["upload_url"].split("{", 1)[0]
          require(upload == "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets", "Unexpected upload URL")
          for name, data in assets.items():
              item = by_name.get(name)
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if item is None:
                  require(release["draft"], "Published release is incomplete; refusing mutation")
                  item = api_request("POST", upload + "?" + urllib.parse.urlencode({"name": name}), data, "application/vnd.android.package-archive" if name.endswith(".apk") else "text/plain; charset=utf-8")
              require(item["name"] == name and item["size"] == len(data) and item["state"] == "uploaded", "Uploaded asset metadata mismatch")
              require(item.get("digest") == digest, "GitHub asset digest mismatch")
          if release["draft"]:
              release = api_request("PATCH", API + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True, "body": RELEASE_NOTES, "make_latest": "false"})
          require(not release["draft"] and release["prerelease"], "Release was not published as a prerelease")
          require(release["body"] == RELEASE_NOTES, "Published notes mismatch")
          for name, data in assets.items():
              url = "https://github.com/" + REPO + "/releases/download/" + TAG + "/" + name
              downloaded = public_download(url, len(data))
              require(hashlib.sha256(downloaded).digest() == hashlib.sha256(data).digest(), "Published download integrity mismatch")
              print("Verified public download: " + name)
          print("Published " + release["html_url"])

          PY
